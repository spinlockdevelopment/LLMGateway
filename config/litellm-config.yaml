# ============================================================
# LLM Gateway — LiteLLM Proxy Configuration
# ============================================================
# Default stack: Anthropic Claude via OpenRouter + native llama-server locals
# Clients: Claude Code, Cursor IDE, any OpenAI/Anthropic SDK
#
# Routes: local (Gemma-4 on the host llama-server at :8082, reached via
# host.docker.internal), coding (Sonnet 5), deep-reasoning (Opus 5.5),
# cheap-research (DeepSeek V4.1 Flash → Qwen3.8 Flash), jev (TypeSafe
# Jev Router). Plus the /laya pass-through (see general_settings).
# Local services are defined in config/llmgateway.defaults.yaml.
# ============================================================

# ── Model Deployments ─────────────────────────────────────────
# model_name = pseudo-model (what clients request)
# litellm_params.model = actual provider/model (what gets called)
# Multiple entries with the same model_name are load-balanced
# and used as fallbacks via the 'order' parameter.

model_list:

  # ── local ───────────────────────────────────────────────────
  # Native llama-server on the host (gateway-managed) — see
  # config/llmgateway.defaults.yaml services.local. Currently
  # serving Gemma-4-26B-A4B UD-Q4_K_M at 128K ctx.
  - model_name: local
    litellm_params:
      model: openai/gemma-4-26b-a4b
      api_base: http://host.docker.internal:8082/v1
      api_key: none

  # ── coding ──────────────────────────────────────────────────
  # Primary workhorse for Claude Code and Cursor. Vision-capable.
  - model_name: coding
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 100
      tpm: 400000

  # ── deep-reasoning ──────────────────────────────────────────
  # Hard problems: architecture, planning, long-horizon debugging.
  - model_name: deep-reasoning
    litellm_params:
      model: openrouter/anthropic/claude-opus-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 60
      tpm: 400000

  # ── cheap-research ──────────────────────────────────────────
  # Bulk research, summarization, triage. DeepSeek V4.1 Flash
  # primary, Qwen3.8 Flash fallback (both ~$0.15/$0.45 per M, 1M ctx).
  - model_name: cheap-research
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      order: 1
      rpm: 200
      tpm: 1000000
  - model_name: cheap-research
    litellm_params:
      model: openrouter/qwen/qwen3.8-flash
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      rpm: 200
      tpm: 1000000

  # ── jev ─────────────────────────────────────────────────────
  # TypeSafe Jev Router via OpenRouter: Jev (TypeSafe's System One
  # model) picks the underlying model + reasoning effort per request.
  # Pricing is per-routed-model (OpenRouter lists it as variable).
  - model_name: jev
    litellm_params:
      model: openrouter/typesafe/jev-router
      api_key: os.environ/OPENROUTER_API_KEY


# ── LiteLLM SDK Settings ─────────────────────────────────────

litellm_settings:
  # Callbacks — must be flat strings recognized by the installed LiteLLM
  # version. Dict-style nested-config callback entries are not supported
  # by the proxy's get_instance_fn and crash startup with
  # `'dict' object has no attribute 'startswith'`.
  # Web search providers are declared in the top-level `search_tools:`
  # section near the bottom of this file.
  callbacks:
    - prometheus
    - websearch_interception

  # Run the `litellm_web_search` tool server-side (first search_tools
  # entry unless search_tool_name is set) for these upstream providers.
  websearch_interception_params:
    enabled_providers: ["openrouter", "openai"]
    search_tool_name: tavily-search

  # As of the 2026-07 litellm build, /metrics defaults to requiring a
  # bearer key. Prometheus (internal to gateway-net, opt-in profile) has
  # no key configured, so leave scraping unauthenticated.
  require_auth_for_metrics_endpoint: false

  # Drop unsupported params instead of erroring
  drop_params: true

  # Fallback chains: if the primary pseudo-model fails entirely, try these
  # alternatives.
  fallbacks:
    - {"deep-reasoning": ["coding"]}
    - {"coding": ["deep-reasoning"]}

  # Cache — Redis response caching (see docker-compose.yml `redis` service)
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379

  # Request logging (opt-in — stores prompts in spend logs table)
  # store_prompts_in_spend_logs: true

  # Retry settings
  num_retries: 2
  request_timeout: 120


# ── Router Settings ───────────────────────────────────────────

router_settings:
  # Use priority ordering (order parameter) with fallback
  enable_pre_call_checks: true

  # Routing strategy for same-priority deployments
  routing_strategy: simple-shuffle

  # Cooldown: if a deployment fails 3 times, skip it for 60s
  allowed_fails: 3
  cooldown_time: 60

  # Retry on specific errors
  retry_after: 5
  num_retries: 2

  # Model aliases — semantic shortcuts.
  model_group_alias:
    "reasoning": "deep-reasoning"
    "code": "coding"


# ── Proxy Server Settings ────────────────────────────────────

general_settings:
  # Master key for admin operations (key/team/budget management)
  master_key: os.environ/LITELLM_MASTER_KEY

  # PostgreSQL for virtual keys, spend tracking, model management
  database_url: os.environ/DATABASE_URL

  # Background health checks — don't hammer providers on every /health
  background_health_checks: true
  health_check_interval: 300

  # Store models in DB so UI changes persist across restarts
  store_model_in_db: true

  # ── Pass-through routes ──────────────────────────────────────
  # /laya → gateway-managed laya-serve on the host (:8087; see
  # config/llmgateway.defaults.yaml services.laya). Laya is a classifier,
  # not a chat model, so it gets a raw path instead of a model_name:
  #   POST /laya/v1/systemone   (Authorization: Bearer <litellm key>)
  #   GET  /laya/health
  # auth: true makes LiteLLM check the virtual key; laya-serve itself is
  # unauthenticated. No LLM token spend is tracked for these calls.
  pass_through_endpoints:
    - path: "/laya"
      target: "http://host.docker.internal:8087"
      include_subpath: true
      auth: true
      timeout: 60

  # Allow direct model pass-through for models not in model_list
  # (clients can request any litellm-supported model string)
  # enable_all_model_access: true


# ── Web Search Tools (managed by the proxy) ───────────────────
# Keys live in .env; clients never see them. Clients invoke web search
# by including a tool named `litellm_web_search` in their request — the
# proxy intercepts it (websearch_interception callback above) and runs the
# call against websearch_interception_params.search_tool_name. Also
# callable directly: POST /v1/search/<search_tool_name>.

search_tools:
  - search_tool_name: tavily-search
    litellm_params:
      search_provider: tavily
      api_key: os.environ/TAVILY_API_KEY

  - search_tool_name: exa-search
    litellm_params:
      search_provider: exa_ai
      api_key: os.environ/EXA_API_KEY


# ── Environment Variables Reference ──────────────────────────
# These are read from the container environment (.env file).
# See .env.example for the full template (and dashboard Secrets UI).
#
#   LITELLM_MASTER_KEY    — admin key for /key, /team, /ui (required)
#   DATABASE_URL          — PostgreSQL connection string (set by stack)
#   OPENROUTER_API_KEY    — primary remote provider (required)
#   ANTHROPIC_API_KEY     — direct Anthropic fallback (optional)
#   OPENAI_API_KEY        — direct OpenAI (optional)
#   OPENAI_BASE_URL       — custom OpenAI base URL (optional; OPENAI_API_BASE also supported)
#   GEMINI_API_KEY        — Google AI Studio (optional)
#   XAI_API_KEY           — xAI / Grok (optional)
#   AZURE_API_KEY, AZURE_API_BASE, AZURE_API_VERSION — Azure OpenAI (optional)
#   PERPLEXITY_API_KEY    — Perplexity (optional)
#   TAVILY_API_KEY        — Tavily web search (used by websearch_interception)
#   EXA_API_KEY           — Exa neural search (used by websearch_interception)
#   OAUTH_*               — OAuth 2.0 token validation (optional, enterprise)
